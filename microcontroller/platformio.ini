[platformio]
default_envs = release

; The released firmware, on the Seeed Studio XIAO ESP32-S3, the board of every OpenGizmo device, with a GC9A01 round display (the pins are in config/pins.h); the serial log is off
[env:release]
; The firmware version comes from the VERSION file of the repository
extra_scripts = pre:firmware_version.py
board = seeed_xiao_esp32s3 ; 8 MB of PSRAM, which holds the frame of the display and the downloaded flights
platform = espressif32 @ 8.0.0
framework = arduino
board_build.partitions = huge_app.csv ; One 3 MB app slot (no wireless updates), the same in every OpenGizmo firmware
build_src_flags = -Wformat ; Check printf-style format strings against their arguments in our own code
monitor_speed = 115200
lib_deps =
	lovyan03/LovyanGFX@1.2.33
	esp32async/ESPAsyncWebServer@3.12.1
	esp32async/AsyncTCP@3.5.0
	bblanchon/ArduinoJson@7.2.2
	https://github.com/open-gizmo/gizmo-common.git#v2.5.1

; The same firmware with the serial log on, and the ESP32 core's own messages (pio run -e debug -t upload, then pio device monitor)
[env:debug]
extends = env:release
build_unflags = -DCORE_DEBUG_LEVEL=0 ; Replace the platform's level (errors off) with info
build_flags =
	-D PIO_DEV_MODE=1
	-D CORE_DEBUG_LEVEL=3

; Host tests for the hardware-free logic (run with: pio test -e native)
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<config/radar_settings.cpp> +<flights/geo.cpp> +<flights/aircraft_parser.cpp> +<flights/aircraft_tracker.cpp> +<flights/fetch_schedule.cpp> +<flights/aircraft_json.cpp> +<display/units.cpp> +<guide/agent_guide.cpp>
build_flags =
	-std=gnu++17
	-D UNITY_INCLUDE_DOUBLE ; The coordinates are doubles
lib_deps =
	throwtheswitch/Unity@2.6.1
	bblanchon/ArduinoJson@7.2.2
